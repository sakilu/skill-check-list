id: handoff
name: 交接單骨架
description: >
  一份合格的交接單至少要交代的東西。產生交接單前逐節確認,
  寫不出來的那一節要照實說「不知道」,絕不留白也絕不編。
  接手者是別的 agent 或別的人,他們手上沒有你這次對話的任何脈絡。

# 這些 section 直接對應交接單頁面左欄的 sections 集合,order 決定顯示順序。
sections:
  - id: scope
    order: 1
    label: 目標與邊界
    must_cover: >
      這件工作要達成什麼,以及明確**不做**什麼。邊界比目標更重要——
      接手者最常見的失敗是把範圍做大,而不是做不完。
    if_unknown: 寫「邊界未定義」並列出你認為有疑義的地方,讓接手者去問。

  - id: env
    order: 2
    label: 環境怎麼跑起來
    must_cover: >
      建置、執行、測試的**確切指令**,以及要在哪個目錄下。
      接手者應該能直接複製貼上,不必猜。有前置條件(要先裝什麼、要哪個版本)也寫在這。
    if_unknown: 寫「未驗證」並說明你自己是怎麼跑起來的,而不是給一段沒跑過的指令。

  - id: progress
    order: 3
    label: 進度到哪
    must_cover: >
      三件事:已經做完什麼、正卡在什麼、下一步該做什麼。
      「做完」要能對應到具體檔案或可驗證的結果,不能只寫「大致完成」。
    if_unknown: 不適用——這一節永遠寫得出來,寫不出來代表你還不該交接。

  - id: traps
    order: 4
    label: 已知雷區
    must_cover: >
      踩過的坑、繞過的死路、看起來合理但其實行不通的做法。
      這一節省下接手者最多時間,也最容易被略過。有踩到就寫,包括你自己犯的錯。
    if_unknown: 寫「目前未遇到」,不要為了填滿而編造。

  - id: creds
    order: 5
    label: 權限與憑證
    must_cover: >
      需要哪些權限、憑證放在哪裡、怎麼確認自己拿到的權限是通的(給出檢查指令)。
      **只寫位置與取得方式,絕不寫值。** 交接單是共享的,寫進去等於外洩。
    if_unknown: 寫「不需要額外權限」或列出你不確定的部分。

  - id: entry
    order: 6
    label: 相關檔案與入口
    must_cover: >
      接手者該先打開哪些檔案,每個檔案負責什麼。用相對路徑,一行一個。
      這是給人的地圖,不是完整檔案清單——只列真正要動或要讀的。
    if_unknown: 至少給出主要目錄,並說明你還沒摸清哪一塊。

# 每個待辦事項的欄位要求。對應交接單頁面右欄的 tasks 集合。
task_fields:
  - name: title
    required: true
    guidance: 一句話說清楚要做什麼,動詞開頭。不是「登入問題」而是「修正登入後 session 沒續期」。

  - name: why
    required: true
    guidance: >
      為什麼要做這件事。**這一欄是給人看的**——接手者需要判斷依據,
      才知道遇到預期外狀況時該怎麼取捨。省略這欄,接手者只能照抄不會思考。

  - name: how
    required: false
    guidance: >
      **這一欄是給 agent 看的**——可直接複製執行的指令,或明確的檔案與函式位置。
      沒有明確做法就留空,不要寫「研究一下」這種等於沒寫的內容。

  - name: verify
    required: true
    guidance: >
      怎樣算做完。要能被驗證——一個指令的結果、一個可觀察的行為。
      「功能正常」不算;「登入後重新整理三次 session 仍在」才算。
      指令要從這個專案實際的建置 / 測試設定取得,並且自己跑過一次確認會過。

  - name: state
    required: true
    guidance: 只能是 todo / doing / done / blocked。blocked 一定要在 why 或 note 說明卡在哪。

  - name: order
    required: true
    guidance: 整數,決定顯示順序。有相依關係的任務要照相依順序排。
